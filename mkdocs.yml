site_name: Khoroos
site_description: A toolkit for video-based poultry behavior analysis
site_url: https://amirivojdan.github.io/khoroos/
repo_url: https://github.com/amirivojdan/khoroos
repo_name: amirivojdan/khoroos
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - User guide:
      - Docker: guide/docker.md
      - Command line: guide/command-line.md
      - Web interface: guide/web-interface.md
      - Python API: guide/python-api.md
      - Replacing components: guide/extending.md
      - Configuration: guide/configuration.md
      - Outputs: guide/outputs.md
      - Interpreting results: guide/interpreting-results.md
  - API reference:
      - Overview: reference/index.md
      - Configuration: reference/config.md
      - Analysis pipeline: reference/analysis.md
      - Runner: reference/runner.md
      - Result types: reference/types.md
      - Extension contracts: reference/extensions.md
  - Development: development.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: sphinx
            filters: ["!^_"]
            heading_level: 2
            members_order: source
            separate_signature: true
            show_root_heading: true
            show_signature_annotations: true
            show_source: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

strict: true
