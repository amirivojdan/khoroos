services:
  khoroos:
    build:
      context: .
      dockerfile: Dockerfile
    image: khoroos:local
    gpus: all
    init: true
    ports:
      - "${KHOROOS_BIND_HOST:-127.0.0.1}:${KHOROOS_PORT:-8000}:8000"
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_HOME: /var/lib/khoroos/huggingface
      KHOROOS_CACHE_DIR: /var/lib/khoroos
      KHOROOS_DEVICE: cuda
      KHOROOS_PREFETCH_MODELS: "${KHOROOS_PREFETCH_MODELS:-auto}"
    volumes:
      - khoroos-data:/var/lib/khoroos
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 10m
      retries: 3

volumes:
  khoroos-data:
