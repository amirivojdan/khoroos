name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch: # Build and validate only; publishing requires a GitHub release.

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ.get("RELEASE_TAG", "")
          if tag and tag != f"v{version}":
              raise SystemExit(f"Release tag {tag!r} must match v{version}")
          print(f"Building khoroos {version}")
          PY

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check package metadata and README
        run: python -m twine check --strict dist/*

      - name: Check packaged assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, "Expected exactly one wheel"
          with ZipFile(wheels[0]) as wheel:
              files = set(wheel.namelist())
              required = {
                  "khoroos/py.typed",
                  "khoroos/web/static/index.html",
                  "khoroos/web/static/app.js",
                  "khoroos/web/static/styles.css",
                  "khoroos/web/static/khoroos.png",
                  "khoroos/web/static/Khoroos-transparent.png",
              }
              assert required <= files, f"Missing package files: {required - files}"
              assert any(name.endswith(".dist-info/licenses/LICENSE") for name in files)
              assert not any(name.endswith((".safetensors", ".pt", ".pth", ".mp4", ".ipynb")) for name in files)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/khoroos
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
